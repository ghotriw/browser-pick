name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal BrowserPick
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Release
        run: |
          ./build.sh release

      - name: Create Zip Archive
        run: |
          cd .build
          ditto -c -k --sequesterRsrc --keepParent BrowserPick.app BrowserPick.zip
          shasum -a 256 BrowserPick.zip > BrowserPick.zip.sha256

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrowserPick-Universal
          path: |
            .build/BrowserPick.zip
            .build/BrowserPick.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/BrowserPick.zip
            .build/BrowserPick.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
